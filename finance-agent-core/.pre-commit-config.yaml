repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Compose's !override tag is valid to Docker Compose but not generic YAML.
        exclude: ^compose/verification/docker-compose\.issue126-verification\.yml$
      - id: check-added-large-files
        exclude: ^frontend/.agent/skills/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      # Run the linter
      - id: ruff
        args: [ --fix ]
        exclude: ^(frontend/.agent/skills/|fundamental-service/)
      # Run the formatter
      - id: ruff-format
        exclude: ^(frontend/.agent/skills/|fundamental-service/)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff-check
        name: Fundamental Service Ruff (CI pin)
        alias: fundamental-ruff
        files: ^fundamental-service/
        args: [ --fix ]
      - id: ruff-format
        name: Fundamental Service format (CI pin)
        alias: fundamental-ruff-format
        files: ^fundamental-service/
