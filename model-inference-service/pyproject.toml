[project]
name = "model-inference-service"
version = "0.1.0"
description = "Private task-specific FinBERT inference service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "prometheus-client>=0.21.0,<1.0.0",
    "uvicorn>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
models = [
    "torch==2.9.1",
    "transformers==4.57.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
