services:
  backend:
    environment:
      APP_ENV: production
      LLM_PROVIDER_SERVICE_TOKEN: ${LLM_PROVIDER_SERVICE_TOKEN:?Set LLM_PROVIDER_SERVICE_TOKEN to a production secret}

  llm-provider-service:
    environment:
      LLM_PROVIDER_SERVICE_TOKEN: ${LLM_PROVIDER_SERVICE_TOKEN:?Set LLM_PROVIDER_SERVICE_TOKEN to a production secret}
      LLM_PROVIDER_ENCRYPTION_KEY: ${LLM_PROVIDER_ENCRYPTION_KEY:?Set LLM_PROVIDER_ENCRYPTION_KEY to a production Fernet key}
