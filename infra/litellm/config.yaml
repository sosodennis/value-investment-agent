router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  retry_after: 1
  allowed_fails: 2
  cooldown_time: 30
  # Cooldown and rate state must be shared by every LiteLLM worker. The
  # application does not maintain a second process-local key selector.
  redis_host: os.environ/LITELLM_REDIS_HOST
  redis_port: os.environ/LITELLM_REDIS_PORT
  redis_password: os.environ/LITELLM_REDIS_PASSWORD

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Proxy-wide coordination state (auth/throttle/rate-limit locks) is separate
  # from response caching and must be shared by all workers.
  coordination_redis:
    host: os.environ/LITELLM_REDIS_HOST
    port: os.environ/LITELLM_REDIS_PORT
    password: os.environ/LITELLM_REDIS_PASSWORD

litellm_settings:
  drop_params: true
