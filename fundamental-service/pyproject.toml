[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fundamental-service"
version = "0.1.0"
description = "Versioned, stateless Fundamental valuation service contracts"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44.0",
  "fastapi>=0.110",
  "pydantic>=2.6",
  "arelle-release==2.47.4",
  "aniso8601>=10.0.1,<11",
  "holidays>=0.85,<1",
  "pytz>=2025.2",
  "uvicorn>=0.30",
  "SQLAlchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
]

[project.scripts]
fundamental-data-release-canary = "fundamental_service.release_runner:main"
fundamental-prepare-source = "fundamental_service.preparation_runner:main"
fundamental-persistence = "fundamental_service.persistence_recovery:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "httpx2>=2.0"]
parser = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fundamental_service = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../finance-agent-core"]
