[project]
name = "search-service"
version = "0.1.0"
description = "Provider-neutral private Search Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "ddgs>=9.0.0,<10.0.0",
    "asyncpg>=0.31.0,<1.0.0",
    "cryptography>=44.0.0,<47.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.10.0,<3.0.0",
    "uvicorn>=0.27.0,<1.0.0",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.0,<0.33.0",
    "jsonschema>=4.26.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src", "../finance-agent-core"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
