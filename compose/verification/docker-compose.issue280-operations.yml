name: ${COMPOSE_PROJECT_NAME:-value-investment-agent-270-integration}

services:
  fundamental-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fundamental
      POSTGRES_PASSWORD: fundamental
      POSTGRES_DB: fundamental
    ports:
      - "${FUNDAMENTAL_POSTGRES_HOST_PORT:-15481}:5432"
    volumes:
      - fundamental-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundamental -d fundamental"]
      interval: 5s
      timeout: 5s
      retries: 10

  fundamental-service:
    build:
      context: ../..
      dockerfile: fundamental-service/Dockerfile
      additional_contexts:
        internal-contracts: ../../finance-agent-core/src/shared
    environment:
      FUNDAMENTAL_SERVICE_DATA_ROOT: /var/lib/fundamental
      FUNDAMENTAL_SERVICE_DATABASE_URL: postgresql+asyncpg://fundamental:fundamental@fundamental-postgres:5432/fundamental
      FUNDAMENTAL_SERVICE_AUTO_MIGRATE: "1"
      FUNDAMENTAL_SERVICE_TOKEN: ${FUNDAMENTAL_SERVICE_TOKEN:-integration-token}
      FUNDAMENTAL_SERVICE_MAX_CALCULATION_SAMPLES: ${FUNDAMENTAL_SERVICE_MAX_CALCULATION_SAMPLES:-10000}
      FUNDAMENTAL_SERVICE_MAX_REQUEST_MS: ${FUNDAMENTAL_SERVICE_MAX_REQUEST_MS:-5000}
      FUNDAMENTAL_MODEL_TRUST_ROOTS_FILE: /run/fundamental/model-trust-roots.json
      FUNDAMENTAL_DATA_RELEASE_TRUST_ROOTS_FILE: /run/fundamental/data-release-trust-roots.json
    ports:
      - "${FUNDAMENTAL_SERVICE_HOST_PORT:-18080}:8080"
    volumes:
      - fundamental-service-data:/var/lib/fundamental
      - ${FUNDAMENTAL_MODEL_TRUST_ROOTS_HOST_FILE:-../../fundamental-service/tests/fixtures/development/model-trust-roots.json}:/run/fundamental/model-trust-roots.json:ro
      - ${FUNDAMENTAL_DATA_RELEASE_TRUST_ROOTS_HOST_FILE:-../../fundamental-service/tests/fixtures/development/data-release-trust-roots.json}:/run/fundamental/data-release-trust-roots.json:ro
    depends_on:
      fundamental-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 10s
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

volumes:
  fundamental-service-data:
  fundamental-postgres-data:
