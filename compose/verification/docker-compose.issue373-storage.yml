name: value-investment-agent-373-storage-verify

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fundamental
      POSTGRES_PASSWORD: storage-verification-only
      POSTGRES_DB: fundamental
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundamental -d fundamental"]
      interval: 3s
      timeout: 3s
      retries: 20
    cpus: 0.5
    mem_limit: 256m

  fundamental:
    image: value-investment-agent-373-storage-fundamental:candidate
    environment:
      FUNDAMENTAL_SERVICE_DATABASE_URL: postgresql+asyncpg://fundamental:storage-verification-only@postgres:5432/fundamental
      FUNDAMENTAL_SERVICE_AUTO_MIGRATE: "1"
      FUNDAMENTAL_SERVICE_TOKEN: storage-verification-only
      FUNDAMENTAL_MODEL_TRUST_ROOTS_FILE: /run/model-trust-roots.json
      FUNDAMENTAL_DATA_RELEASE_TRUST_ROOTS_FILE: /run/data-release-trust-roots.json
    volumes:
      - fundamental-data:/var/lib/fundamental
      - ../../fundamental-service/tests/fixtures/development/model-trust-roots.json:/run/model-trust-roots.json:ro
      - ../../fundamental-service/tests/fixtures/development/data-release-trust-roots.json:/run/data-release-trust-roots.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 512m

  news:
    image: value-investment-agent-373-storage-news:candidate
    environment: &inference-environment
      INFERENCE_OPERATIONS: news.sentiment
      INFERENCE_SERVICE_TOKEN: storage-verification-only
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_LOCAL_FILES_ONLY: "1"
      TORCH_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    healthcheck: &inference-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 20
    cpus: 1.0
    mem_limit: 1536m

  fls:
    image: value-investment-agent-373-storage-fls:candidate
    environment:
      <<: *inference-environment
      INFERENCE_OPERATIONS: sec.fls
    healthcheck: *inference-healthcheck
    cpus: 1.0
    mem_limit: 1536m

networks:
  default:
    internal: true

volumes:
  postgres-data:
  fundamental-data:
