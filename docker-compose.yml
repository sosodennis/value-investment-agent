services:
  postgres:
    image: postgres:16-alpine
    platform: linux/arm64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-langgraph}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-langgraph}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    platform: linux/arm64
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional single-instance LLM gateway POC. Start it with:
  # docker compose --profile llm-gateway up -d llm-gateway
  llm-gateway:
    image: docker.litellm.ai/berriai/litellm:main-stable
    platform: linux/arm64
    profiles:
      - llm-gateway
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/litellm
      STORE_MODEL_IN_DB: "True"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY for the LLM gateway}
      OPENROUTER_API_KEY_1: ${OPENROUTER_API_KEY_1:-}
      OPENROUTER_API_KEY_2: ${OPENROUTER_API_KEY_2:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
      OPENROUTER_X_TITLE: ${OPENROUTER_X_TITLE:-Value Investment Agent}
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      llm-gateway-db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  llm-gateway-db-init:
    image: postgres:16-alpine
    platform: linux/arm64
    profiles:
      - llm-gateway
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command:
      ["sh", "/opt/init/create-litellm-database.sh"]
    volumes:
      - ./infra/litellm/create-litellm-database.sh:/opt/init/create-litellm-database.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./finance-agent-core
      dockerfile: Dockerfile
    platform: linux/arm64
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-langgraph}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - HF_HOME=/opt/hf-cache
      - HF_BAKED_CACHE=/opt/hf-cache-baked
      - HF_HUB_CACHE=/opt/hf-cache/hub
      - SENTENCE_TRANSFORMERS_HOME=/opt/hf-cache/hub
      - FASTEMBED_CACHE_PATH=/opt/hf-cache/hub
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_LOCAL_FILES_ONLY=1
      - NEWS_FINBERT_WARMUP=1
      - SEC_TEXT_FLS_WARMUP=1
      - SEC_TEXT_DEPENDENCY_WARMUP=1
      - SEC_TEXT_DEPENDENCY_MODEL=en_core_web_sm
      - SEC_TEXT_DEBUG_RETRIEVAL_SENTENCES=1
      - SEC_TEXT_DEBUG_RETRIEVAL_SENTENCES_LIMIT=3
      - SEC_TEXT_DEBUG_RETRIEVAL_SENTENCE_CHARS=220
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL}
      - LLM_GATEWAY_BASE_URL=${LLM_GATEWAY_BASE_URL:-}
      - LLM_GATEWAY_API_KEY=${LITELLM_MASTER_KEY}
      - FRED_API_KEY=${FRED_API_KEY}
      # Add other necessary env vars here
    volumes:
      - hf_cache:/opt/hf-cache
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  technical-labeling-scheduler:
    build:
      context: ./finance-agent-core
      dockerfile: Dockerfile
    platform: linux/arm64
    profiles:
      - scheduler
    command: ["supercronic", "/app/scripts/technical_outcome_labeling.crontab"]
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-langgraph}
      - TZ=UTC
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  # ==========================================
  # Frontend Service
  # ==========================================
  # PRODUCTION MODE (default):
  #   dockerfile: Dockerfile
  #   - Optimized build, minified, fast
  #   - No hot reload
  #
  # DEVELOPMENT MODE (for debugging):
  #   dockerfile: Dockerfile.dev
  #   - Hot reload enabled
  #   - Slower, includes dev tools
  #   - Also uncomment the volumes section below
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile        # <- Change to Dockerfile.dev for development
    platform: linux/arm64
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
    # ==========================================
    # DEVELOPMENT MODE: Uncomment below for hot reload
    # ==========================================
    # volumes:
    #   - ./frontend/src:/app/src
    #   - ./frontend/public:/app/public

volumes:
  pg_data:
  redis_data:
  hf_cache:

networks:
  default:
    name: agent_network
