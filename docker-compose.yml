x-backend-build: &backend-build
  context: ./finance-agent-core
  dockerfile: Dockerfile
  args:
    BAKE_HF_MODELS: ${BAKE_HF_MODELS:-1}

x-backend-image: &backend-image "${COMPOSE_PROJECT_NAME:-value-investment-agent}-backend"

x-model-inference-environment: &model-inference-environment
  INFERENCE_SERVICE_TOKEN: ${INFERENCE_SERVICE_TOKEN:-}
  INFERENCE_ALLOW_INSECURE: ${INFERENCE_ALLOW_INSECURE:-0}
  NEWS_FINBERT_MODEL: ${NEWS_FINBERT_MODEL:-project-aps/finbert-finetune}
  NEWS_FINBERT_REVISION: ${NEWS_FINBERT_REVISION:-2db55b5439cef6253c12a4973f3a9e823ff90b79}
  SEC_FLS_MODEL: ${SEC_FLS_MODEL:-yiyanghkust/finbert-fls}
  SEC_FLS_REVISION: ${SEC_FLS_REVISION:-443586dc31c765c0aaf1c4daaed8cf3643c92fa5}
  # Model artifacts are baked into each inference image. Keep the default
  # runtime path on that immutable layer so startup does not copy them into a
  # second named volume.
  HF_HOME: /opt/hf-cache-baked
  HF_BAKED_CACHE: /opt/hf-cache-baked
  HF_HUB_CACHE: /opt/hf-cache-baked/hub
  TRANSFORMERS_CACHE: /opt/hf-cache-baked/hub
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_LOCAL_FILES_ONLY: "1"
  TORCH_NUM_THREADS: ${INFERENCE_TORCH_NUM_THREADS:-1}

x-model-inference-common: &model-inference-common
  build:
    context: ./model-inference-service
    dockerfile: Dockerfile
    additional_contexts:
      internal-contracts: ./finance-agent-core/src/shared
    args:
      BAKE_HF_MODELS: ${BAKE_INFERENCE_MODELS:-1}
      INFERENCE_OPERATIONS: news.sentiment,sec.fls
      NEWS_FINBERT_MODEL: ${NEWS_FINBERT_MODEL:-project-aps/finbert-finetune}
      NEWS_FINBERT_REVISION: ${NEWS_FINBERT_REVISION:-2db55b5439cef6253c12a4973f3a9e823ff90b79}
      SEC_FLS_MODEL: ${SEC_FLS_MODEL:-yiyanghkust/finbert-fls}
      SEC_FLS_REVISION: ${SEC_FLS_REVISION:-443586dc31c765c0aaf1c4daaed8cf3643c92fa5}
  platform: linux/arm64
  environment:
    <<: *model-inference-environment
  expose:
    - "8001"
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8001/readyz"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 60s
  mem_reservation: ${INFERENCE_MEMORY_RESERVATION:-1250m}
  mem_limit: ${INFERENCE_MEMORY_LIMIT:-1500m}
  cpus: ${INFERENCE_CPUS:-4.0}
  restart: always

services:
  postgres:
    image: postgres:16-alpine
    platform: linux/arm64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-langgraph}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-langgraph}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    platform: linux/arm64
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: *backend-image
    build: *backend-build
    platform: linux/arm64
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-langgraph}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - HF_HOME=/opt/hf-cache-baked
      - HF_BAKED_CACHE=/opt/hf-cache-baked
      - HF_HUB_CACHE=/opt/hf-cache-baked/hub
      - SENTENCE_TRANSFORMERS_HOME=/opt/hf-cache-baked/hub
      - FASTEMBED_CACHE_PATH=/opt/hf-cache-baked/hub
      - TRANSFORMERS_CACHE=/opt/hf-cache-baked/hub
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_LOCAL_FILES_ONLY=1
      - MODEL_INFERENCE_TOKEN=${INFERENCE_SERVICE_TOKEN:-}
      - MODEL_INFERENCE_NEWS_URL=${MODEL_INFERENCE_NEWS_URL:-http://model-inference-news:8001}
      - MODEL_INFERENCE_FLS_URL=${MODEL_INFERENCE_FLS_URL:-http://model-inference-fls:8001}
      - LLM_PROVIDER_SERVICE_URL=${LLM_PROVIDER_SERVICE_URL:-http://llm-provider-service:8002}
      - LLM_PROVIDER_SERVICE_TOKEN=${LLM_PROVIDER_SERVICE_TOKEN:-}
      - SEARCH_SERVICE_URL=${SEARCH_SERVICE_URL:-http://search-service:8003}
      - ORG_DIRECTORY_SEARCH_PER_USER_PER_MINUTE=${ORG_DIRECTORY_SEARCH_PER_USER_PER_MINUTE:-30}
      - ORG_INVITATIONS_PER_ACTOR_PER_HOUR=${ORG_INVITATIONS_PER_ACTOR_PER_HOUR:-10}
      - ORG_INVITATIONS_PER_ORGANIZATION_PER_HOUR=${ORG_INVITATIONS_PER_ORGANIZATION_PER_HOUR:-50}
      - ORG_INVITATIONS_PER_RECIPIENT_PER_HOUR=${ORG_INVITATIONS_PER_RECIPIENT_PER_HOUR:-10}
      - ORG_INVITATION_RESENDS_PER_INVITATION_PER_HOUR=${ORG_INVITATION_RESENDS_PER_INVITATION_PER_HOUR:-3}
      - ORG_ROLE_CHANGES_PER_ACTOR_PER_HOUR=${ORG_ROLE_CHANGES_PER_ACTOR_PER_HOUR:-30}
      - ORG_ROLE_CHANGES_PER_ORGANIZATION_PER_HOUR=${ORG_ROLE_CHANGES_PER_ORGANIZATION_PER_HOUR:-100}
      - ORG_NOTIFICATION_FANOUT_PER_ORGANIZATION_PER_MINUTE=${ORG_NOTIFICATION_FANOUT_PER_ORGANIZATION_PER_MINUTE:-100}
      - ORG_NOTIFICATION_FANOUT_SYSTEM_PER_MINUTE=${ORG_NOTIFICATION_FANOUT_SYSTEM_PER_MINUTE:-1000}
      - ORG_NOTIFICATION_RETENTION_DAYS=${ORG_NOTIFICATION_RETENTION_DAYS:-90}
      - ORG_EXPIRED_NOTIFICATION_RETENTION_DAYS=${ORG_EXPIRED_NOTIFICATION_RETENTION_DAYS:-30}
      - SEARCH_SERVICE_TOKEN=${SEARCH_SERVICE_TOKEN:-local-development-only-token}
      - DIRECTORY_CURSOR_SECRET=${DIRECTORY_CURSOR_SECRET:-local-development-only-directory-cursor-secret}
      - AUDIT_CURSOR_SECRET=${AUDIT_CURSOR_SECRET:-local-development-only-audit-cursor-secret}
      - SEC_TEXT_DEPENDENCY_WARMUP=1
      - SEC_TEXT_DEPENDENCY_MODEL=en_core_web_sm
      - SEC_TEXT_DEBUG_RETRIEVAL_SENTENCES=1
      - SEC_TEXT_DEBUG_RETRIEVAL_SENTENCES_LIMIT=3
      - SEC_TEXT_DEBUG_RETRIEVAL_SENTENCE_CHARS=220
      - APP_ENV=${APP_ENV:-development}
      - CLIENT_DEBUG_CAPTURE_ENABLED=${CLIENT_DEBUG_CAPTURE_ENABLED:-false}
      - CLIENT_DEBUG_MAX_EVENTS_PER_REQUEST=${CLIENT_DEBUG_MAX_EVENTS_PER_REQUEST:-50}
      - CLIENT_DEBUG_MAX_EVENTS_PER_CAPTURE=${CLIENT_DEBUG_MAX_EVENTS_PER_CAPTURE:-10000}
      - CLIENT_DEBUG_MAX_BYTES_PER_CAPTURE=${CLIENT_DEBUG_MAX_BYTES_PER_CAPTURE:-1048576}
      - CLIENT_DEBUG_MAX_TOTAL_BYTES=${CLIENT_DEBUG_MAX_TOTAL_BYTES:-33554432}
      - CLIENT_DEBUG_MAX_CAPTURES=${CLIENT_DEBUG_MAX_CAPTURES:-128}
      - CLIENT_DEBUG_MAX_CAPTURES_PER_OWNER=${CLIENT_DEBUG_MAX_CAPTURES_PER_OWNER:-8}
      - CLIENT_DEBUG_MAX_EVENTS_PER_OWNER_PER_MINUTE=${CLIENT_DEBUG_MAX_EVENTS_PER_OWNER_PER_MINUTE:-30000}
      - CLIENT_DEBUG_CAPTURE_TTL_SECONDS=${CLIENT_DEBUG_CAPTURE_TTL_SECONDS:-86400}
      - CORS_ALLOWED_ORIGINS=${FRONTEND_ALLOWED_ORIGINS:-http://127.0.0.1:${FRONTEND_HOST_PORT:-3000},http://localhost:${FRONTEND_HOST_PORT:-3000}}
      - FRONTEND_ALLOWED_ORIGINS=${FRONTEND_ALLOWED_ORIGINS:-http://127.0.0.1:${FRONTEND_HOST_PORT:-3000},http://localhost:${FRONTEND_HOST_PORT:-3000}}
      - FRED_API_KEY=${FRED_API_KEY}
      # Add other necessary env vars here
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-provider-service:
        condition: service_healthy
      backend-migrations:
        condition: service_completed_successfully
    restart: always

  backend-migrations:
    image: *backend-image
    build: *backend-build
    platform: linux/arm64
    command: ["python", "-m", "src.infrastructure.migrations.cli"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-langgraph}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  llm-provider-service:
    build:
      context: ./llm-provider-service
      dockerfile: Dockerfile
      additional_contexts:
        internal-contracts: ./finance-agent-core/src/shared
    platform: linux/arm64
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-langgraph}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LLM_PROVIDER_SERVICE_TOKEN: ${LLM_PROVIDER_SERVICE_TOKEN:-}
      LLM_PROVIDER_ENCRYPTION_KEY: ${LLM_PROVIDER_ENCRYPTION_KEY:?set LLM_PROVIDER_ENCRYPTION_KEY for the LLM provider service}
      LLM_PROVIDER_KEY_COOLDOWN_SECONDS: ${LLM_PROVIDER_KEY_COOLDOWN_SECONDS:-30}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
      OPENROUTER_X_TITLE: ${OPENROUTER_X_TITLE:-Value Investment Agent}
    expose:
      - "8002"
    ports:
      - "127.0.0.1:${LLM_PROVIDER_SERVICE_HOST_PORT:-8002}:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8002/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: always

  search-service:
    build:
      context: ./search-service
      dockerfile: Dockerfile
      additional_contexts:
        internal-contracts: ./finance-agent-core/src/shared
    platform: linux/arm64
    environment:
      SEARCH_SERVICE_TOKEN: ${SEARCH_SERVICE_TOKEN:-local-development-only-token}
      SEARCH_CONTROL_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-langgraph}
      SEARCH_PROVIDER_ENCRYPTION_KEY: ${SEARCH_PROVIDER_ENCRYPTION_KEY:-}
      TAVILY_API_ENABLED: ${TAVILY_API_ENABLED:-1}
    expose:
      - "8003"
    ports:
      - "127.0.0.1:${SEARCH_SERVICE_HOST_PORT:-8003}:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/readyz', timeout=4).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

  model-inference-news:
    <<: *model-inference-common
    build:
      context: ./model-inference-service
      dockerfile: Dockerfile
      additional_contexts:
        internal-contracts: ./finance-agent-core/src/shared
      args:
        BAKE_HF_MODELS: ${BAKE_INFERENCE_MODELS:-1}
        INFERENCE_OPERATIONS: news.sentiment
        NEWS_FINBERT_MODEL: ${NEWS_FINBERT_MODEL:-project-aps/finbert-finetune}
        NEWS_FINBERT_REVISION: ${NEWS_FINBERT_REVISION:-2db55b5439cef6253c12a4973f3a9e823ff90b79}
        SEC_FLS_MODEL: ${SEC_FLS_MODEL:-yiyanghkust/finbert-fls}
        SEC_FLS_REVISION: ${SEC_FLS_REVISION:-443586dc31c765c0aaf1c4daaed8cf3643c92fa5}
    environment:
      <<: *model-inference-environment
      INFERENCE_OPERATIONS: news.sentiment

  model-inference-fls:
    <<: *model-inference-common
    build:
      context: ./model-inference-service
      dockerfile: Dockerfile
      additional_contexts:
        internal-contracts: ./finance-agent-core/src/shared
      args:
        BAKE_HF_MODELS: ${BAKE_INFERENCE_MODELS:-1}
        INFERENCE_OPERATIONS: sec.fls
        NEWS_FINBERT_MODEL: ${NEWS_FINBERT_MODEL:-project-aps/finbert-finetune}
        NEWS_FINBERT_REVISION: ${NEWS_FINBERT_REVISION:-2db55b5439cef6253c12a4973f3a9e823ff90b79}
        SEC_FLS_MODEL: ${SEC_FLS_MODEL:-yiyanghkust/finbert-fls}
        SEC_FLS_REVISION: ${SEC_FLS_REVISION:-443586dc31c765c0aaf1c4daaed8cf3643c92fa5}
    environment:
      <<: *model-inference-environment
      INFERENCE_OPERATIONS: sec.fls

  technical-labeling-scheduler:
    build:
      context: ./finance-agent-core
      dockerfile: Dockerfile
    platform: linux/arm64
    profiles:
      - scheduler
    command: ["supercronic", "/app/scripts/technical_outcome_labeling.crontab"]
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-langgraph}
      - TZ=UTC
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  collaboration-retention-scheduler:
    build:
      context: ./finance-agent-core
      dockerfile: Dockerfile
    platform: linux/arm64
    profiles:
      - scheduler
    command: ["supercronic", "/app/scripts/collaboration_retention.crontab"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-langgraph}
      ORG_NOTIFICATION_RETENTION_DAYS: ${ORG_NOTIFICATION_RETENTION_DAYS:-90}
      ORG_EXPIRED_NOTIFICATION_RETENTION_DAYS: ${ORG_EXPIRED_NOTIFICATION_RETENTION_DAYS:-30}
      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  # ==========================================
  # Frontend Service
  # ==========================================
  # PRODUCTION MODE (default):
  #   dockerfile: Dockerfile
  #   - Optimized build, minified, fast
  #   - No hot reload
  #
  # DEVELOPMENT MODE (for debugging):
  #   dockerfile: Dockerfile.dev
  #   - Hot reload enabled
  #   - Slower, includes dev tools
  #   - Also uncomment the volumes section below
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile        # <- Change to Dockerfile.dev for development
      args:
        NEXT_PUBLIC_LANGGRAPH_URL: ${NEXT_PUBLIC_LANGGRAPH_URL:-http://127.0.0.1:${BACKEND_HOST_PORT:-8000}}
        NEXT_PUBLIC_ENABLE_CLIENT_DEBUG_CAPTURE: ${NEXT_PUBLIC_ENABLE_CLIENT_DEBUG_CAPTURE:-false}
    platform: linux/arm64
    environment:
      - NEXT_PUBLIC_LANGGRAPH_URL=${NEXT_PUBLIC_LANGGRAPH_URL:-http://127.0.0.1:${BACKEND_HOST_PORT:-8000}}
      - NEXT_PUBLIC_ENABLE_CLIENT_DEBUG_CAPTURE=${NEXT_PUBLIC_ENABLE_CLIENT_DEBUG_CAPTURE:-false}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    # ==========================================
    # DEVELOPMENT MODE: Uncomment below for hot reload
    # ==========================================
    # volumes:
    #   - ./frontend/src:/app/src
    #   - ./frontend/public:/app/public

volumes:
  pg_data:
  redis_data:
