x-model-inference-environment: &model-inference-environment
  INFERENCE_SERVICE_TOKEN: ${INFERENCE_SERVICE_TOKEN:-}
  INFERENCE_ALLOW_INSECURE: ${INFERENCE_ALLOW_INSECURE:-0}
  NEWS_FINBERT_MODEL: ${NEWS_FINBERT_MODEL:-project-aps/finbert-finetune}
  NEWS_FINBERT_REVISION: ${NEWS_FINBERT_REVISION:-2db55b5439cef6253c12a4973f3a9e823ff90b79}
  SEC_FLS_MODEL: ${SEC_FLS_MODEL:-yiyanghkust/finbert-fls}
  SEC_FLS_REVISION: ${SEC_FLS_REVISION:-443586dc31c765c0aaf1c4daaed8cf3643c92fa5}
  HF_HOME: /opt/hf-cache
  HF_BAKED_CACHE: /opt/hf-cache-baked
  HF_HUB_CACHE: /opt/hf-cache/hub
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_LOCAL_FILES_ONLY: "1"
  TORCH_NUM_THREADS: ${INFERENCE_TORCH_NUM_THREADS:-1}

x-model-inference-common: &model-inference-common
  build:
    context: ./model-inference-service
    dockerfile: Dockerfile
    additional_contexts:
      internal-contracts: ./finance-agent-core/src/shared
    args:
      BAKE_HF_MODELS: ${BAKE_INFERENCE_MODELS:-1}
      INFERENCE_OPERATIONS: news.sentiment,sec.fls
      NEWS_FINBERT_MODEL: ${NEWS_FINBERT_MODEL:-project-aps/finbert-finetune}
      NEWS_FINBERT_REVISION: ${NEWS_FINBERT_REVISION:-2db55b5439cef6253c12a4973f3a9e823ff90b79}
      SEC_FLS_MODEL: ${SEC_FLS_MODEL:-yiyanghkust/finbert-fls}
      SEC_FLS_REVISION: ${SEC_FLS_REVISION:-443586dc31c765c0aaf1c4daaed8cf3643c92fa5}
  platform: linux/arm64
  environment:
    <<: *model-inference-environment
  expose:
    - "8001"
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8001/readyz"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 60s
  mem_reservation: ${INFERENCE_MEMORY_RESERVATION:-1250m}
  mem_limit: ${INFERENCE_MEMORY_LIMIT:-1500m}
  cpus: ${INFERENCE_CPUS:-4.0}
  restart: always

services:
  postgres:
    image: postgres:16-alpine
    platform: linux/arm64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-langgraph}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-langgraph}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    platform: linux/arm64
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional LLM gateway POC. Start it with:
  # docker compose --profile llm-gateway up -d llm-gateway
  llm-gateway:
    image: docker.litellm.ai/berriai/litellm@sha256:1acf80698f7eb47021b0bf5aed01ba9e80098cf74cdb3e588515bdd48a129fa6
    platform: linux/arm64
    profiles:
      - llm-gateway
    command:
      ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "${LLM_GATEWAY_WORKERS:-1}"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/litellm
      STORE_MODEL_IN_DB: "True"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY for the LLM gateway}
      LITELLM_REDIS_HOST: ${LITELLM_REDIS_HOST:-redis}
      LITELLM_REDIS_PORT: ${LITELLM_REDIS_PORT:-6379}
      LITELLM_REDIS_PASSWORD: ${LITELLM_REDIS_PASSWORD:-}
      LLM_PROVIDER_KEY_COOLDOWN_SECONDS: ${LLM_PROVIDER_KEY_COOLDOWN_SECONDS:-30}
    mem_limit: ${LLM_GATEWAY_MEMORY_LIMIT:-1g}
    cpus: ${LLM_GATEWAY_CPUS:-1.0}
    restart: unless-stopped
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
      - ./infra/litellm/provider_key_telemetry.py:/app/provider_key_telemetry.py:ro
    ports:
      - "127.0.0.1:${LLM_GATEWAY_HOST_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      llm-gateway-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  llm-gateway-contract-redis:
    image: redis:7-alpine
    platform: linux/arm64
    profiles:
      - llm-gateway-contract-test
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  llm-gateway-contract-test:
    image: docker.litellm.ai/berriai/litellm@sha256:1acf80698f7eb47021b0bf5aed01ba9e80098cf74cdb3e588515bdd48a129fa6
    platform: linux/arm64
    profiles:
      - llm-gateway-contract-test
    entrypoint: ["python3", "/app/router_retry_contract.py"]
    volumes:
      - ./infra/litellm/router_retry_contract.py:/app/router_retry_contract.py:ro
      - ./infra/litellm/provider_key_telemetry.py:/app/provider_key_telemetry.py:ro
    environment:
      LITELLM_REDIS_HOST: llm-gateway-contract-redis
      LITELLM_REDIS_PORT: 6379
      LLM_PROVIDER_KEY_COOLDOWN_SECONDS: 1
    depends_on:
      llm-gateway-contract-redis:
        condition: service_healthy

  llm-gateway-db-init:
    image: postgres:16-alpine
    platform: linux/arm64
    profiles:
      - llm-gateway
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command:
      ["sh", "/opt/init/create-litellm-database.sh"]
    volumes:
      - ./infra/litellm/create-litellm-database.sh:/opt/init/create-litellm-database.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./finance-agent-core
      dockerfile: Dockerfile
      args:
        BAKE_HF_MODELS: ${BAKE_HF_MODELS:-1}
    platform: linux/arm64
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-langgraph}
      - REDIS_HOST=${LITELLM_REDIS_HOST:-redis}
      - REDIS_PORT=${LITELLM_REDIS_PORT:-6379}
      - REDIS_PASSWORD=${LITELLM_REDIS_PASSWORD:-}
      - HF_HOME=/opt/hf-cache
      - HF_BAKED_CACHE=/opt/hf-cache-baked
      - HF_HUB_CACHE=/opt/hf-cache/hub
      - SENTENCE_TRANSFORMERS_HOME=/opt/hf-cache/hub
      - FASTEMBED_CACHE_PATH=/opt/hf-cache/hub
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_LOCAL_FILES_ONLY=1
      - MODEL_INFERENCE_TOKEN=${INFERENCE_SERVICE_TOKEN:-}
      - MODEL_INFERENCE_NEWS_URL=${MODEL_INFERENCE_NEWS_URL:-http://model-inference-news:8001}
      - MODEL_INFERENCE_FLS_URL=${MODEL_INFERENCE_FLS_URL:-http://model-inference-fls:8001}
      - LLM_PROVIDER_SERVICE_URL=${LLM_PROVIDER_SERVICE_URL:-http://llm-provider-service:8002}
      - LLM_PROVIDER_SERVICE_TOKEN=${LLM_PROVIDER_SERVICE_TOKEN:-}
      - SEC_TEXT_DEPENDENCY_WARMUP=1
      - SEC_TEXT_DEPENDENCY_MODEL=en_core_web_sm
      - SEC_TEXT_DEBUG_RETRIEVAL_SENTENCES=1
      - SEC_TEXT_DEBUG_RETRIEVAL_SENTENCES_LIMIT=3
      - SEC_TEXT_DEBUG_RETRIEVAL_SENTENCE_CHARS=220
      - APP_ENV=${APP_ENV:-development}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:3001,http://localhost:3001}
      - LOCAL_ADMIN_ALLOWED_ORIGINS=${LOCAL_ADMIN_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:3001,http://localhost:3001}
      - FRED_API_KEY=${FRED_API_KEY}
      # Add other necessary env vars here
    volumes:
      - hf_cache:/opt/hf-cache
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-provider-service:
        condition: service_healthy
    restart: always

  llm-provider-service:
    build:
      context: ./llm-provider-service
      dockerfile: Dockerfile
      additional_contexts:
        internal-contracts: ./finance-agent-core/src/shared
    platform: linux/arm64
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-langgraph}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${LITELLM_REDIS_PASSWORD:-}
      LLM_PROVIDER_SERVICE_TOKEN: ${LLM_PROVIDER_SERVICE_TOKEN:-}
      LLM_GATEWAY_BASE_URL: ${LLM_GATEWAY_BASE_URL:-http://llm-gateway:4000}
      LLM_GATEWAY_API_KEY: ${LITELLM_MASTER_KEY:-}
      LLM_GATEWAY_MAX_ATTEMPTS: ${LLM_GATEWAY_MAX_ATTEMPTS:-3}
      LLM_GATEWAY_MAX_ATTEMPTS_INTERACTIVE: ${LLM_GATEWAY_MAX_ATTEMPTS_INTERACTIVE:-2}
      LLM_GATEWAY_MAX_ATTEMPTS_BACKGROUND: ${LLM_GATEWAY_MAX_ATTEMPTS_BACKGROUND:-3}
      LLM_GATEWAY_BACKOFF_SECONDS: ${LLM_GATEWAY_BACKOFF_SECONDS:-0.25}
      LLM_GATEWAY_MAX_BACKOFF_SECONDS: ${LLM_GATEWAY_MAX_BACKOFF_SECONDS:-8}
      LLM_GATEWAY_JITTER_SECONDS: ${LLM_GATEWAY_JITTER_SECONDS:-0.25}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
      OPENROUTER_X_TITLE: ${OPENROUTER_X_TITLE:-Value Investment Agent}
      LLM_GATEWAY_REQUIRE_PRINCIPAL: ${LLM_GATEWAY_REQUIRE_PRINCIPAL:-true}
    expose:
      - "8002"
    ports:
      - "127.0.0.1:${LLM_PROVIDER_SERVICE_HOST_PORT:-8002}:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8002/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: always

  search-service:
    build:
      context: ./search-service
      dockerfile: Dockerfile
      additional_contexts:
        internal-contracts: ./finance-agent-core/src/shared
    platform: linux/arm64
    environment:
      SEARCH_SERVICE_TOKEN: ${SEARCH_SERVICE_TOKEN:-local-development-only-token}
    expose:
      - "8003"
    ports:
      - "127.0.0.1:${SEARCH_SERVICE_HOST_PORT:-8003}:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/livez', timeout=4).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: always

  model-inference-news:
    <<: *model-inference-common
    build:
      context: ./model-inference-service
      dockerfile: Dockerfile
      additional_contexts:
        internal-contracts: ./finance-agent-core/src/shared
      args:
        BAKE_HF_MODELS: ${BAKE_INFERENCE_MODELS:-1}
        INFERENCE_OPERATIONS: news.sentiment
        NEWS_FINBERT_MODEL: ${NEWS_FINBERT_MODEL:-project-aps/finbert-finetune}
        NEWS_FINBERT_REVISION: ${NEWS_FINBERT_REVISION:-2db55b5439cef6253c12a4973f3a9e823ff90b79}
        SEC_FLS_MODEL: ${SEC_FLS_MODEL:-yiyanghkust/finbert-fls}
        SEC_FLS_REVISION: ${SEC_FLS_REVISION:-443586dc31c765c0aaf1c4daaed8cf3643c92fa5}
    environment:
      <<: *model-inference-environment
      INFERENCE_OPERATIONS: news.sentiment
    volumes:
      - inference_news_hf_cache:/opt/hf-cache

  model-inference-fls:
    <<: *model-inference-common
    build:
      context: ./model-inference-service
      dockerfile: Dockerfile
      additional_contexts:
        internal-contracts: ./finance-agent-core/src/shared
      args:
        BAKE_HF_MODELS: ${BAKE_INFERENCE_MODELS:-1}
        INFERENCE_OPERATIONS: sec.fls
        NEWS_FINBERT_MODEL: ${NEWS_FINBERT_MODEL:-project-aps/finbert-finetune}
        NEWS_FINBERT_REVISION: ${NEWS_FINBERT_REVISION:-2db55b5439cef6253c12a4973f3a9e823ff90b79}
        SEC_FLS_MODEL: ${SEC_FLS_MODEL:-yiyanghkust/finbert-fls}
        SEC_FLS_REVISION: ${SEC_FLS_REVISION:-443586dc31c765c0aaf1c4daaed8cf3643c92fa5}
    environment:
      <<: *model-inference-environment
      INFERENCE_OPERATIONS: sec.fls
    volumes:
      - inference_fls_hf_cache:/opt/hf-cache

  technical-labeling-scheduler:
    build:
      context: ./finance-agent-core
      dockerfile: Dockerfile
    platform: linux/arm64
    profiles:
      - scheduler
    command: ["supercronic", "/app/scripts/technical_outcome_labeling.crontab"]
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-langgraph}
      - TZ=UTC
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  # ==========================================
  # Frontend Service
  # ==========================================
  # PRODUCTION MODE (default):
  #   dockerfile: Dockerfile
  #   - Optimized build, minified, fast
  #   - No hot reload
  #
  # DEVELOPMENT MODE (for debugging):
  #   dockerfile: Dockerfile.dev
  #   - Hot reload enabled
  #   - Slower, includes dev tools
  #   - Also uncomment the volumes section below
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile        # <- Change to Dockerfile.dev for development
      args:
        NEXT_PUBLIC_LANGGRAPH_URL: ${NEXT_PUBLIC_LANGGRAPH_URL:-http://127.0.0.1:8000}
    platform: linux/arm64
    environment:
      - NEXT_PUBLIC_LANGGRAPH_URL=${NEXT_PUBLIC_LANGGRAPH_URL:-http://127.0.0.1:8000}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    # ==========================================
    # DEVELOPMENT MODE: Uncomment below for hot reload
    # ==========================================
    # volumes:
    #   - ./frontend/src:/app/src
    #   - ./frontend/public:/app/public

volumes:
  pg_data:
  redis_data:
  hf_cache:
  inference_news_hf_cache:
  inference_fls_hf_cache:
